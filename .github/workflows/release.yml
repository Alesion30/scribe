name: Release

on:
  workflow_dispatch:

# Every write goes through the app token below, so the default token only ever reads.
permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      # Dispatching from a topic branch would tag commits main never took.
      - name: Check the branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release runs on $DEFAULT_BRANCH only, but was dispatched on $GITHUB_REF_NAME." >&2
            exit 1
          fi

      # next-version.sh walks back to the previous release tag, so it needs the whole history and every tag.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: next
        run: |
          ./scripts/next-version.sh >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Overwriting a published tag is what damaged v0.1.0, so refuse before the build spends twenty minutes.
      - name: Check the tag and release are unused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

  build:
    needs: version
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Same pinned toolchain as the quality checks, so a green PR cannot fail here.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # scribe --version reads a literal out of the source, so the number has to land before the compiler runs.
      - name: Stamp the version
        run: ./scripts/set-version.sh "${{ needs.version.outputs.version }}"

      # mise run build has no --arch, and the release ships both slices.
      - name: Build (Release)
        run: mise exec -- swift build -c release --arch ${{ matrix.arch }}

      - name: Prepare artifact
        run: |
          BINARY=".build/${{ matrix.arch }}-apple-macosx/release/scribe"
          FRAMEWORK=$(find .build/artifacts -type d -path '*whisper.xcframework/macos-*/whisper.framework')
          test -d "$FRAMEWORK"
          ARTIFACT="scribe-macos-${{ matrix.arch }}"
          mkdir -p "$ARTIFACT"
          cp "$BINARY" "$ARTIFACT/scribe"
          cp -R "$FRAMEWORK" "$ARTIFACT/whisper.framework"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scribe-macos-${{ matrix.arch }}
          path: scribe-macos-${{ matrix.arch }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # main sits behind a ruleset GITHUB_TOKEN cannot bypass; the release app is on its bypass list.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts

      # A release missing one slice is worse than no release, and nothing has been published yet at this point.
      - name: Check both slices arrived
        run: |
          for ARCH in arm64 x86_64; do
            test -f "artifacts/scribe-macos-$ARCH/scribe-macos-$ARCH.tar.gz"
          done

      - name: Stamp the version
        run: ./scripts/set-version.sh "${{ needs.version.outputs.version }}"

      # createCommitOnBranch keeps main's required signatures intact: GitHub signs the commit, a runner cannot.
      - name: Commit the version bump
        id: bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD: ${{ needs.version.outputs.sha }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE: Sources/scribe/Scribe.swift
        run: |
          # A rerun after a failed publish finds the bump already committed, and re-tagging it is the fix.
          if git diff --quiet; then
            echo "$SOURCE already holds $VERSION, so $EXPECTED_HEAD is tagged as is." >&2
            echo "oid=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg expectedHeadOid "$EXPECTED_HEAD" \
            --arg headline "chore(release): $TAG" \
            --arg path "$SOURCE" \
            --arg contents "$(base64 -w 0 "$SOURCE")" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                  expectedHeadOid: $expectedHeadOid,
                  message: {headline: $headline},
                  fileChanges: {additions: [{path: $path, contents: $contents}]}
                }
              }
            }' > commit.json
          OID=$(gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit.oid')
          echo "Committed $OID on $BRANCH." >&2
          echo "oid=$OID" >> "$GITHUB_OUTPUT"

      # gh release create cuts the tag itself, so a failure here cannot strand a tag with no release behind it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ steps.bump.outputs.oid }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$TARGET" \
            --generate-notes

      # No --clobber: the tag was checked to be unused, so anything already attached means something went wrong.
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/scribe-macos-arm64/scribe-macos-arm64.tar.gz \
            artifacts/scribe-macos-x86_64/scribe-macos-x86_64.tar.gz
