name: Quality

on:
  pull_request:
    # Without edited, fixing a rejected PR title would leave the check red until the next push.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Title edits get their own lane so they cannot cancel an in-flight build of the same pull request.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A squash merge takes its subject from here, and release.yml reads those subjects to pick the next version.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # squash_merge_commit_title is COMMIT_OR_PR_TITLE, so a one-commit PR merges that commit's subject instead.
          validateSingleCommit: true

  build-test:
    name: Swift build and test
    # Editing a title or body cannot change the code, so keep the macOS runners out of it.
    if: github.event.action != 'edited'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # mise.lock pins the toolchain by checksum, so CI builds with the same Swift as a local checkout.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # The whisper xcframework unpacks to ~160 MB, so a cold fetch makes every run hostage to the download.
      - name: Cache SwiftPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # There is no mise task for a debug build; release builds are what mise run build is for.
      - name: Build (Debug)
        run: mise exec -- swift build -c debug

      - name: Test
        run: mise run test

  lint:
    name: SwiftLint
    if: github.event.action != 'edited'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint
        run: mise run lint
