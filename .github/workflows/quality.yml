name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner defaults to Xcode 16.4, which accepts code that Swift 6.3 on our machines rejects.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build-test:
    name: Swift build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The whisper xcframework unpacks to ~160 MB, so a cold fetch makes every run hostage to the download.
      - name: Cache SwiftPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build (Debug)
        run: swift build -c debug

      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # SwiftLint ships with the runner; print the version so an image bump adding rules is easy to spot.
      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --strict
